<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKI Swedish Prep</title>
    <style>
        :root {
            --primary: #005b9f;
            --primary-hover: #00467a;
            --bg: #f4f7f6;
            --text: #333;
            --card-bg: #fff;
            --correct: #2e7d32;
            --incorrect: #c62828;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: var(--primary);
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--primary-hover); }
        .mode-btn.active { outline: 3px solid #ffca28; }
        
        .card {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        .question { font-size: 22px; font-weight: bold; margin-bottom: 20px; }
        .category {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 12px;
            color: #777;
            text-transform: uppercase;
        }
        .answer {
            font-size: 20px;
            color: var(--primary);
            margin-bottom: 20px;
            display: none;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .grading-controls {
            display: none;
            gap: 10px;
            justify-content: center;
        }
        .btn-correct { background-color: var(--correct); }
        .btn-incorrect { background-color: var(--incorrect); }
        
        .stats {
            margin-top: 20px;
            font-size: 16px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>YKI Swedish Prep</h1>
    
    <div class="controls">
        <button class="mode-btn active" onclick="setMode('vocabulary')">Vocabulary</button>
        <button class="mode-btn" onclick="setMode('grammar')">Grammar</button>
        <button class="mode-btn" onclick="setMode('prompts')">Exam Prompts</button>
    </div>

    <div class="card" id="flashcard">
        <div class="category" id="categoryDisplay">Category</div>
        <div class="question" id="questionDisplay">Loading data...</div>
        <div class="answer" id="answerDisplay"></div>
        
        <button id="showAnswerBtn" onclick="showAnswer()">Show Answer</button>
        
        <div class="grading-controls" id="gradingControls">
            <button class="btn-incorrect" onclick="grade(false)">Got it wrong</button>
            <button class="btn-correct" onclick="grade(true)">Got it right</button>
        </div>
    </div>

    <div class="stats">
        Score: <span id="scoreDisplay">0</span> / <span id="totalDisplay">0</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
